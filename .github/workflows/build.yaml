name: Build Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            ext: .exe
            extra_flags: >-
              --msvc=latest
              --windows-console-mode=disable
              --windows-icon-from-ico=assets/icon.ico
          - platform: linux-x64
            os: ubuntu-latest
            ext: ""
            extra_flags: >-
              --linux-icon=assets/icon.ico

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache binutils

      - name: Cache ccache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-x64-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ccache-linux-x64-

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project and build dependencies
        run: uv sync --frozen --no-dev --group build

      - name: Load branding
        id: meta
        shell: bash
        run: |
          {
            echo "binary_name=$(jq -r .binary_name assets/brand.json)"
            echo "company_name=$(jq -r .company_name assets/brand.json)"

            ver="${GITHUB_REF#refs/tags/}"
            ver="${ver#v}"
            [[ "$ver" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]] || ver="0"
            IFS='.' read -ra parts <<< "$ver"
            while [ "${#parts[@]}" -lt 4 ]; do parts+=(0); done
            echo "win_version=${parts[0]}.${parts[1]}.${parts[2]}.${parts[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Build binary with Nuitka
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          WIN_ARGS=()
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            WIN_ARGS=(
              "--company-name=${{ steps.meta.outputs.company_name }}"
              "--product-name=${{ steps.meta.outputs.binary_name }}"
              "--file-version=${{ steps.meta.outputs.win_version }}"
              "--product-version=${{ steps.meta.outputs.win_version }}"
            )
          fi

          uv run --no-sync python -m nuitka \
            --mode=onefile \
            --lto=yes \
            --python-flag=no_docstrings \
            --python-flag=-O \
            --python-flag=no_site \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-data-dir=assets=assets \
            --output-dir=dist \
            --output-filename="${{ steps.meta.outputs.binary_name }}-${{ matrix.platform }}${{ matrix.ext }}" \
            ${{ matrix.extra_flags }} \
            "${WIN_ARGS[@]}" \
            src/app.py

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/${{ steps.meta.outputs.binary_name }}-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.binary_name }}-${{ matrix.platform }}
          path: dist/${{ steps.meta.outputs.binary_name }}-${{ matrix.platform }}${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
