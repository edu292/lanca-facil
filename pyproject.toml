[project]
name = "lanca-facil"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "xlsxwriter>=3.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
build = [
    "imageio>=2.38.2",
    "nuitka>=4.3.5",
    "ordered-set>=4.1.0",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html"
